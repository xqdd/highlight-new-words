<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Feed — dense page with dynamic content</title>
<style>
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; background: #f3f4f6; color: #111827; }
  .bar { position: sticky; top: 0; z-index: 5; background: #111827; color: #fff; padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
  .bar button { font: inherit; padding: 4px 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; padding: 8px; }
  .item { background: #fff; border-radius: 6px; padding: 8px 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .item h3 { margin: 0 0 4px; font-size: 15px; }
  .item p { margin: 0; color: #374151; }
  .tag { display: inline-block; font-size: 11px; background: #e5e7eb; border-radius: 3px; padding: 0 5px; margin-right: 4px; }
  #ticker { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="bar">
  <strong>Live Feed</strong>
  <span id="ticker">Status: initializing</span>
  <button id="more" type="button">Load more</button>
</div>
<div class="grid" id="feed"></div>
<script>
  // 固定种子的伪随机，保证截图可复现
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const subjects = ['Regulators', 'Researchers', 'Investors', 'Volunteers', 'Analysts', 'Negotiators', 'Engineers', 'Historians'];
  const verbs = ['scrutinized', 'abandoned', 'endorsed', 'postponed', 'challenged', 'accelerated', 'undermined', 'clarified'];
  const objects = ['the ambiguous proposal', 'an unprecedented merger', 'the controversial survey', 'several obsolete regulations', 'a comprehensive inventory', 'the fragile ceasefire', 'an ambitious curriculum', 'the hypothetical scenario'];
  const tails = ['amid mounting skepticism.', 'despite considerable resistance.', 'after a prolonged deliberation.', 'with remarkable efficiency.', 'following persistent complaints.', 'in a surprisingly candid statement.'];
  const pick = (a) => a[Math.floor(rand() * a.length)];
  let n = 0;
  function makeItem() {
    n++;
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<h3>#' + n + ' ' + pick(subjects) + ' ' + pick(verbs) + ' ' + pick(objects) + '</h3>' +
      '<p><span class="tag">update</span>' + pick(subjects) + ' ' + pick(verbs) + ' ' + pick(objects) + ' ' + pick(tails) + ' ' +
      pick(subjects) + ' later ' + pick(verbs) + ' ' + pick(objects) + ' ' + pick(tails) + '</p>';
    return div;
  }
  const feed = document.getElementById('feed');
  function load(count) { const frag = document.createDocumentFragment(); for (let i = 0; i < count; i++) frag.appendChild(makeItem()); feed.appendChild(frag); }
  load(24);
  document.getElementById('more').addEventListener('click', () => load(12));
  // 模拟异步加载：600ms 后追加一批；1200ms 后修改已有文本节点（characterData）
  setTimeout(() => load(12), 600);
  setTimeout(() => {
    document.getElementById('ticker').firstChild.data = 'Status: negotiators reached a tentative agreement';
    const p = feed.querySelector('.item p');
    p.lastChild.data = ' Correction: the committee subsequently reversed its controversial decision.';
  }, 1200);
  // 模拟 SPA：2000ms 后整体替换第一个卡片的内容
  setTimeout(() => { feed.firstElementChild.innerHTML = '<h3>Breaking: lawmakers scrutinize the ambiguous legislation</h3><p>The deliberation continues.</p>'; }, 2000);
</script>
</body>
</html>
